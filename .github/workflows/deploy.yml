name: Deploy Astro website on server
run-name: Website deploy
on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:
concurrency:
  group: Astro-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  BuildAndDeploy:
    environment: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: true
      - name: Build Astro site
        run: pnpm run build
        env:
          PUBLIC_SITE_URL: https://${{ secrets.domain_name }}
      - name: Send the site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ftp_address }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: /${{ secrets.domain_name }}/public_html/